[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AquaSEBS"
version = "1.3.1"
description = "Aquatic Surface Energy Balance System (AquaSEBS) Water Surface Evaporation Model"
readme = "README.md"
authors = [
    { name = "Gregory H. Halverson", email = "gregory.h.halverson@jpl.nasa.gov" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "check-distribution",
    "daylight-evapotranspiration",
    "GEOS5FP",
    "NASADEM",
    "numpy",
    "priestley-taylor>=1.1.2",
    "pytictoc",
    "rasters",
    "verma-net-radiation"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "build",
    "jupyter",
    "pytest>=6.0",
    "pytest-cov",
    "twine"
]

[tool.setuptools.packages.find]
exclude = ["notebooks", "tests"]

[project.urls]
"Homepage" = "https://github.com/JPL-Evapotranspiration-Algorithms/AquaSEBS"